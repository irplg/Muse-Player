name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      # SFCompose 的 AAR 元数据要求 AGP 9，因此 compileSdk 必须用 37.1（预览通道）。
      - name: Install SDK platform 37.1
        run: sdkmanager --channel=3 "platforms;android-37.1" "build-tools;37.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Muse-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
